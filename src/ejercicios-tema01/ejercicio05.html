<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 5</title>
</head>
<body>
  <script>
    // prompt() devuelve texto (string), así que lo convertimos con Number()
    // Si no, "2" + "3" daría "23" en vez de 5
    var num1 = parseFloat(prompt("Introduce el primer número:"));
    var num2 = parseFloat(prompt("Introduce el segundo número:"));

    // Operador suma
    var suma = num1 + num2;

    alert("La suma de " + num1 + " y " + num2 + " es: " + suma);
  </script>
</body>
</html>
