<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>de km a metros</title>
</head>
<body>
    <button onclick="kmhams()">pasar d3 kilometros por hora a metros por segundo </button>
    <script>
        function kmhams() {
            let kmh = Number(prompt("Introduce una velocidad en kilometros por hora"));
            
            let ms = kmh/3.6

            alert("tu velocidad en metros por segundo es :s" + ms);
        }
    </script>
</body>
</html>
