<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mayor o menor</title>
</head>
<body>
    <button onclick="mayor()">Introduce dos numero _:</button>
    <script>
        function mayor(){
            let n1 = Number(prompt("Introduce un número :"));
            
            let n2 = Number(prompt("Introduce un número :"));


            if(n1>n2){
                alert("el numero mayor es :" + n1);
            }else{
                alert ("el numero mayor es :" + n2);
            }
        }
    </script>
</body>
</html>
