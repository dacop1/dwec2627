<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salto de línea</title>
</head>
<body>
    <button onclick="saltar()">Pulsa para ver el salto de línea</button>
    <script>
        function saltar() {
            alert("Primera línea\nSegunda línea");
        }

        // <br> es una etiqueta de HTML que significa
        //  “break” (romper) y hace un salto de línea: lo que va después se escribe en la línea siguiente.
    </script>
</body>
</html>
