<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma</title>
</head>

<body>
    <button onclick="suma()">Pulsa para hacer una suma</button>
    <script>
        function suma() {
            const n1 = Number(prompt("Introduce un número"));
            const n2 = Number(prompt("Introduce otro número"));

            const nfinal = n1 + n2;

            alert("Tu suma es: " + nfinal);
        }
    </script>
</body>

</html>
