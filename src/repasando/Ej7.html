<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>par o impar</title>
</head>
<body>
    <button onclick="paroimpar()">Introduce un número</button>
    <script>
        function paroimpar (){
            let n1 = Number(prompt("Introduce un número :"));

            if (n1%2 == 0 ){
                alert ("Caballero tu número es par y es :" + n1 );
            } else {
                alert("Caballero tu número es impar y es :" + n1);
            }
        }
    </script>
</body>
</html>
