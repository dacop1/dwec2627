<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijos</title>
</head>
<body>
    <!-- esto es un boton que llama a la funcion -->
    <button onclick="hijos()">¿Cuántos hijos tienes?</button>

    <script>

        // esto es una funcion
        function hijos() {
            const numhijos = prompt("Introduce el número de hijos");
            alert("Tienes ${numhijos} hijos");
        }
    </script>
</body>
</html>
