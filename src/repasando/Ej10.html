<body>
    <button onclick="ordenamiento()"> pulsame para ordenar tres números cualquiera</button>

    <script>
        function ordenamiento(){

            let n1 = Number(prompt("Introduce un número ;"));
            let n2 = Number(prompt("Introduce un número ;"));
            let n3 = Number(prompt("Introduce un número ;"));


            const num = [n1,n2,n3];

            num.sort((a, b) => a - b);

            alert("tus número ordenados son : " + num );


        }
    </script>
