<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ejercicio01</title>
</head>
<body onload="mayor()">
    <script>
        function mayor(){        var num1 = parseFloat(prompt("Introduce una edad:"));
            var num2 = parseFloat(prompt("Introduce una segundo:"));

            if ( num1 > num2) {
                alert("El número mayor es : " + num1);
            }
            else{
                alert("El número mayor es  : " + num2);
            }
        }


    </script>
</body>
</html>
